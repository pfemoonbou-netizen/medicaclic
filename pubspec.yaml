name: medicaclic
description: "A Flutter medical app with pharmacy and doctor consultation features."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Navigation & Routing
  go_router: ^13.0.0

  # State Management
  provider: ^6.0.0

  # HTTP Requests
  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.0

  # UI Components
  cached_network_image: ^3.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
