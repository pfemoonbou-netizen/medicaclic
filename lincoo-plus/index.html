<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lincoo+ — Espace Vendeur Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:   #F6F8FC; --sb:  #FFFFFF; --card:#FFFFFF;
  --brd:  #E7E9F3; --blue:#3B82F6; --purp:#A855F7;
  --teal: #0891B2; --gold:#B45309; --red: #DC2626;
  --green:#16A34A; --txt: #0D0B2D; --dim: #667085;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 20px rgba(16,24,40,.05);
}
body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--txt); height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }

/* LOGIN */
#login-screen {
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  background:radial-gradient(ellipse at 25% 60%,rgba(59,130,246,.12),transparent 50%),
             radial-gradient(ellipse at 75% 30%,rgba(168,85,247,.1),transparent 50%),var(--bg);
}
.lcard { background:var(--card); border:1px solid var(--brd); border-radius:24px; padding:48px 40px; width:420px; box-shadow:0 30px 60px rgba(16,24,40,.12), 0 8px 24px rgba(16,24,40,.08); }
.lbrand { text-align:center; margin-bottom:36px; }
.lbrand h1 { font-size:36px; font-weight:900; letter-spacing:2px; background:linear-gradient(135deg,var(--blue),var(--purp)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.lbrand p { color:var(--dim); font-size:13px; margin-top:4px; }
.lfield { margin-bottom:16px; }
.lfield label { display:block; font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.7px; margin-bottom:6px; }
.lfield input { width:100%; padding:13px 16px; background:var(--bg); border:1.5px solid var(--brd); border-radius:12px; color:var(--txt); font-size:14px; outline:none; transition:border-color .2s; font-family:inherit; }
.lfield input:focus { border-color:var(--blue); }
.lbtn { width:100%; padding:14px; background:linear-gradient(135deg,var(--blue),var(--purp)); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; margin-top:8px; transition:opacity .2s; font-family:inherit; }
.lbtn:hover { opacity:.9; } .lbtn:disabled { opacity:.5; cursor:default; }
#lerr { color:var(--red); font-size:12px; text-align:center; margin-top:10px; min-height:16px; }

/* APP SHELL */
#app { display:none; height:100vh; }
#app.on { display:flex; }

/* SIDEBAR */
#sidebar { width:220px; min-width:220px; background:var(--sb); border-right:1px solid var(--brd); display:flex; flex-direction:column; height:100vh; overflow-y:auto; flex-shrink:0; }
.sb-top { padding:20px; border-bottom:1px solid var(--brd); }
.sb-logo { font-size:22px; font-weight:900; letter-spacing:1px; background:linear-gradient(135deg,var(--blue),var(--purp)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.sb-sub { font-size:10px; color:var(--dim); margin-top:2px; }
.sb-nav { flex:1; padding:8px 0; }
.nb-grp { font-size:9px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:1px; padding:14px 18px 5px; }
.ni { display:flex; align-items:center; gap:10px; padding:10px 18px; cursor:pointer; color:var(--dim); font-size:13px; font-weight:600; position:relative; transition:all .15s; user-select:none; }
.ni:hover { color:var(--txt); background:rgba(13,11,45,.04); }
.ni.on { color:var(--blue); background:rgba(59,130,246,.1); }
.ni.on::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--blue); border-radius:0 3px 3px 0; }
.ni-i { font-size:15px; width:20px; text-align:center; }
.sb-foot { padding:14px 18px; border-top:1px solid var(--brd); }
.sb-user { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.sb-av { width:32px; height:32px; border-radius:9px; flex-shrink:0; background:linear-gradient(135deg,var(--blue),var(--purp)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff; }
.sb-nm { font-size:12px; font-weight:700; }
.sb-rl { font-size:10px; color:var(--dim); }
.sb-out { width:100%; padding:7px; background:rgba(220,38,38,.1); border:1px solid rgba(220,38,38,.2); border-radius:8px; color:var(--red); font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .2s; }
.sb-out:hover { background:rgba(220,38,38,.2); }

/* MAIN */
#main { flex:1; overflow-y:auto; padding:28px; }
.ph { margin-bottom:22px; }
.pt { font-size:22px; font-weight:900; letter-spacing:-.5px; }
.ps { font-size:12px; color:var(--dim); margin-top:4px; }

/* KPI */
.kg { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:12px; margin-bottom:20px; }
.kc { background:var(--card); border:1px solid var(--brd); border-radius:14px; padding:18px; position:relative; overflow:hidden; }
.kl { font-size:10px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:7px; }
.kv { font-size:26px; font-weight:900; letter-spacing:-1px; line-height:1; }
.kd { font-size:10px; color:var(--dim); margin-top:5px; }
.ki { position:absolute; top:14px; right:14px; font-size:20px; opacity:.5; }

/* CHART CARD */
.cc { background:var(--card); border:1px solid var(--brd); border-radius:14px; padding:20px; margin-bottom:20px; }
.ch { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.ct { font-size:14px; font-weight:800; }

/* TABLE CARD */
.tc { background:var(--card); border:1px solid var(--brd); border-radius:14px; overflow:hidden; margin-bottom:20px; }
.th { padding:14px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--brd); }
.tt { font-size:13px; font-weight:800; }
.ta { font-size:11px; color:var(--blue); cursor:pointer; font-weight:700; }
table { width:100%; border-collapse:collapse; }
thead th { padding:10px 18px; text-align:left; font-size:9px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid var(--brd); }
tbody tr { border-bottom:1px solid rgba(13,11,45,.04); transition:background .15s; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:rgba(13,11,45,.025); }
tbody td { padding:12px 18px; font-size:12px; }

/* BADGES */
.b { display:inline-block; padding:3px 9px; border-radius:100px; font-size:10px; font-weight:700; }
.bbl { background:rgba(59,130,246,.15); color:var(--blue); }
.bgn { background:rgba(22,163,74,.15); color:var(--green); }
.bgo { background:rgba(180,83,9,.15); color:var(--gold); }
.brd { background:rgba(220,38,38,.15); color:var(--red); }
.bpu { background:rgba(168,85,247,.15); color:var(--purp); }
.btl { background:rgba(8,145,178,.15); color:var(--teal); }
.bdm { background:rgba(102,112,133,.15); color:var(--dim); }

/* TOGGLE */
.tog { position:relative; width:42px; height:22px; flex-shrink:0; }
.tog input { display:none; }
.tsl { position:absolute; inset:0; background:var(--brd); border-radius:100px; cursor:pointer; transition:background .2s; }
.tsl::before { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:3px; left:3px; transition:transform .2s; }
.tog input:checked+.tsl { background:var(--blue); }
.tog input:checked+.tsl::before { transform:translateX(20px); }

/* TOOLBAR */
.bar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.srch { flex:1; max-width:300px; padding:9px 14px; background:var(--card); border:1px solid var(--brd); border-radius:10px; color:var(--txt); font-size:12px; font-family:inherit; outline:none; }
.srch:focus { border-color:var(--blue); }
.bp { padding:9px 18px; background:linear-gradient(135deg,var(--blue),var(--purp)); color:#fff; border:none; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; transition:opacity .2s; }
.bp:hover { opacity:.9; }

/* PRODUCTS */
.pg { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:12px; }
.pcard { background:var(--card); border:1px solid var(--brd); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
.pimg { width:100%; height:150px; object-fit:cover; }
.pfb { width:100%; height:150px; background:var(--brd); display:flex; align-items:center; justify-content:center; font-size:40px; }
.pi { padding:11px 13px; }
.pn { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
.pp { font-size:14px; font-weight:900; color:var(--blue); }
.ps2 { font-size:10px; color:var(--dim); margin-top:2px; }
.pbs { display:flex; gap:6px; padding:9px 13px; border-top:1px solid var(--brd); }
.pb { flex:1; padding:6px; border-radius:7px; border:1px solid var(--brd); background:transparent; color:var(--dim); font-size:10px; font-weight:700; cursor:pointer; transition:all .15s; font-family:inherit; }
.pb:hover { background:var(--brd); color:var(--txt); }
.pb.del:hover { background:rgba(220,38,38,.15); border-color:var(--red); color:var(--red); }

/* CRED RING */
.ring-wrap { width:160px; height:160px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
.ring-in { width:118px; height:118px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.cg { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cr { background:var(--card); border:1px solid var(--brd); border-radius:12px; padding:13px; }
.cr-t { display:flex; justify-content:space-between; margin-bottom:7px; }
.cr-n { font-size:12px; font-weight:700; }
.cr-p { font-size:12px; font-weight:800; color:var(--teal); }
.bar-bg { height:4px; background:var(--brd); border-radius:2px; overflow:hidden; }
.bar-f { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--blue),var(--teal)); }

/* AUTO */
.ac { background:var(--card); border:1px solid var(--brd); border-radius:14px; padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:10px; box-shadow:var(--shadow); }
.ai { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.at { flex:1; }
.at-t { font-size:13px; font-weight:800; margin-bottom:2px; }
.at-d { font-size:11px; color:var(--dim); }

/* COACH */
.coach { background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(236,72,153,.14)); border:1px solid rgba(168,85,247,.35); border-radius:16px; padding:24px; margin-bottom:18px; }
.coach-h { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.coach-av { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--purp),#EC4899); display:flex; align-items:center; justify-content:center; font-size:22px; }
.coach-msg { font-size:13px; line-height:1.75; color:rgba(13,11,45,.88); }
.ctips { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.ctip { background:rgba(13,11,45,.07); border-radius:10px; padding:10px 14px; font-size:12px; display:flex; gap:8px; align-items:flex-start; }

/* PACKS */
.pkgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.pk { background:var(--card); border:1px solid var(--brd); border-radius:16px; padding:22px 18px; text-align:center; position:relative; overflow:hidden; box-shadow:var(--shadow); }
.pk.pop { border-color:var(--blue); }
.pk-pop { position:absolute; top:10px; right:10px; background:var(--blue); color:#fff; font-size:9px; font-weight:800; padding:3px 8px; border-radius:6px; }
.pk-cur { position:absolute; top:10px; left:10px; background:rgba(22,163,74,.2); color:var(--green); font-size:9px; font-weight:800; padding:3px 8px; border-radius:6px; }
.pk-nm { font-size:15px; font-weight:900; margin-bottom:4px; }
.pk-pr { font-size:26px; font-weight:900; margin:10px 0 3px; }
.pk-pe { font-size:10px; color:var(--dim); margin-bottom:14px; }
.pk-ul { list-style:none; text-align:left; margin-bottom:18px; }
.pk-ul li { font-size:11px; color:rgba(13,11,45,.75); padding:4px 0; display:flex; align-items:center; gap:6px; }
.pk-ul li::before { content:'✓'; color:var(--teal); font-weight:900; font-size:10px; }
.pk-btn { width:100%; padding:10px; border-radius:10px; border:none; font-size:12px; font-weight:800; cursor:pointer; transition:opacity .2s; font-family:inherit; }
.pk-btn:hover { opacity:.9; }

/* HELPERS */
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.g31 { display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
.row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--brd); }
.row:last-child { border-bottom:none; }
.rl { font-size:11px; color:var(--dim); }
.rv { font-size:12px; font-weight:800; }
.wb { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.wb-n { width:120px; font-size:11px; font-weight:700; flex-shrink:0; }
.wb-bg { flex:1; height:8px; background:var(--brd); border-radius:4px; overflow:hidden; }
.wb-f { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--blue),var(--purp)); }
.wb-p { width:36px; text-align:right; font-size:11px; font-weight:700; color:var(--blue); }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--txt); color:#fff; padding:12px 24px; border-radius:12px; font-size:13px; font-weight:700; transition:transform .3s; z-index:9999; white-space:nowrap; box-shadow:var(--shadow); }
.toast.on { transform:translateX(-50%) translateY(0); }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--brd); border-radius:4px; }

/* LIVRAISONS TABS */
.ltabs { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.ltab { padding:7px 16px; border-radius:9px; border:1px solid var(--brd); background:transparent; color:var(--dim); font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
.ltab.on { background:rgba(59,130,246,.15); border-color:var(--blue); color:var(--blue); }
/* COMPANY CARDS */
.co-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-bottom:18px; }
.co-card { background:var(--card); border:1.5px solid var(--brd); border-radius:14px; padding:16px; transition:border-color .15s; box-shadow:var(--shadow); }
.co-card.on { border-color:var(--blue); }
.co-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.co-logo { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.co-nm { font-size:13px; font-weight:800; }
.co-st { font-size:10px; color:var(--dim); }
.co-api { width:100%; padding:7px 10px; background:var(--bg); border:1px solid var(--brd); border-radius:8px; color:var(--txt); font-size:11px; font-family:monospace; outline:none; margin-top:6px; }
.co-api:focus { border-color:var(--blue); }
/* EXPEDITION CARDS */
.exp-card { background:var(--card); border:1px solid var(--brd); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); }
.exp-info { flex:1; }
.exp-client { font-size:13px; font-weight:800; }
.exp-meta { font-size:10px; color:var(--dim); margin-top:2px; }
/* MODAL */
.modal-ov { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background:var(--card); border:1px solid var(--brd); border-radius:18px; padding:28px; width:500px; max-width:95vw; max-height:90vh; overflow-y:auto; box-shadow:0 24px 48px rgba(16,24,40,.16); }
.modal-h { font-size:17px; font-weight:900; margin-bottom:20px; }
.mfield { margin-bottom:14px; }
.mfield label { display:block; font-size:10px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:5px; }
.mfield input, .mfield select, .mfield textarea { width:100%; padding:9px 12px; background:var(--bg); border:1px solid var(--brd); border-radius:10px; color:var(--txt); font-size:12px; font-family:inherit; outline:none; }
.mfield input:focus, .mfield select:focus, .mfield textarea:focus { border-color:var(--blue); }
.mfield select option { background:var(--card); }
.mrow { display:flex; gap:10px; }
.mrow .mfield { flex:1; }
.mbtn-row { display:flex; gap:10px; margin-top:20px; }
.mbtn { flex:1; padding:11px; border-radius:10px; border:none; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; transition:opacity .2s; }
.mbtn:hover { opacity:.85; }
.mbtn-p { background:linear-gradient(135deg,var(--blue),var(--purp)); color:#fff; }
.mbtn-s { background:var(--bg); border:1px solid var(--brd); color:var(--txt); }
/* TEAM */
.team-tbl td, .team-tbl th { padding:11px 14px; font-size:12px; }
.team-tbl thead th { font-size:9px; }
.role-sel { background:var(--bg); border:1px solid var(--brd); border-radius:8px; color:var(--txt); padding:4px 8px; font-size:11px; font-family:inherit; outline:none; cursor:pointer; }
.role-sel option { background:var(--card); }
/* TARIFF INPUTS */
.tariff-inp { width:78px; padding:5px 7px; background:var(--bg); border:1px solid var(--brd); border-radius:7px; color:var(--teal); font-size:11px; font-weight:700; font-family:inherit; outline:none; text-align:right; }
.tariff-inp:focus { border-color:var(--blue); color:var(--txt); }
.tariff-inp.mod { border-color:rgba(8,145,178,.4); background:rgba(8,145,178,.05); }

/* ─── PRO UI OVERRIDES ─── */
/* Sidebar */
#sidebar { border-right:1px solid var(--brd); box-shadow:none; }
.sb-top { padding:22px 18px 18px; }
.sb-logo { font-size:18px; font-weight:800; letter-spacing:0.2px; }
.sb-sub { font-size:10px; color:var(--dim); margin-top:3px; letter-spacing:0.3px; }
.nb-grp { font-size:9px; letter-spacing:1.5px; padding:20px 16px 4px; color:rgba(102,112,133,.6); }
.ni { margin:1px 10px; border-radius:8px; padding:9px 10px; font-size:12.5px; font-weight:500; gap:9px; }
.ni:hover { background:rgba(13,11,45,.05); color:var(--txt); }
.ni.on { background:rgba(59,130,246,.1); color:var(--blue); font-weight:600; }
.ni.on::before { display:none; }
.ni-i { width:15px; height:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ni-i svg { width:15px; height:15px; stroke-width:1.75; }
.sb-rl { font-size:10px; color:rgba(102,112,133,.85); font-weight:500; }
.sb-nm { font-size:12.5px; font-weight:600; }
.sb-av { width:30px; height:30px; border-radius:8px; font-size:11px; }
.sb-foot { padding:12px 16px 16px; }
.sb-out { border-radius:8px; font-size:11px; font-weight:600; padding:8px; letter-spacing:0.2px; }

/* Main area */
#main { padding:24px 28px; }
.ph { margin-bottom:20px; }
.pt { font-size:19px; font-weight:800; letter-spacing:-0.5px; }
.ps { font-size:11.5px; color:var(--dim); margin-top:3px; font-weight:400; }

/* Cards */
.kc { border-radius:10px; border-color:var(--brd); box-shadow:var(--shadow); padding:16px; }
.ki { display:none; }
.kl { font-size:9.5px; font-weight:600; letter-spacing:0.8px; margin-bottom:8px; }
.kv { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
.kd { font-size:10px; margin-top:6px; }
.cc { border-radius:10px; border-color:var(--brd); box-shadow:var(--shadow); padding:18px; }
.tc { border-radius:10px; border-color:var(--brd); box-shadow:var(--shadow); }
.ch { margin-bottom:14px; }
.ct { font-size:13px; font-weight:700; letter-spacing:-0.2px; }
.th { padding:13px 16px; }
.tt { font-size:12px; font-weight:700; }
.ta { font-size:11px; font-weight:600; }

/* Table */
thead th { font-size:9px; font-weight:700; letter-spacing:0.9px; padding:9px 14px; color:rgba(102,112,133,.75); }
tbody td { padding:11px 14px; font-size:12px; }

/* Badges */

/* Buttons */
.bp { background:var(--blue); border-radius:8px; font-size:12px; font-weight:600; letter-spacing:0.1px; padding:9px 16px; }
.bp:hover { opacity:1; filter:brightness(1.12); }
.lbtn { font-weight:600; border-radius:10px; font-size:12px; letter-spacing:0.1px; }

/* Login card */
.lcard { border-radius:18px; padding:44px 38px; }

/* Toggle */
.tog { width:38px; height:20px; }
.tsl::before { width:14px; height:14px; top:3px; left:3px; }
.tog input:checked+.tsl::before { transform:translateX(18px); }

/* Pack cards */
.pk { border-radius:14px; padding:20px 16px; }
.pk-nm { font-size:14px; font-weight:800; letter-spacing:-0.2px; }
.pk-pr { font-size:24px; font-weight:900; letter-spacing:-0.8px; }
.pk-ul li { font-size:11px; padding:3.5px 0; }
.pk-btn { border-radius:9px; font-size:12px; font-weight:600; padding:10px; }

/* Coach */
.coach { border-radius:14px; padding:22px; }
.coach-msg { font-size:12.5px; line-height:1.8; }
.ctip { font-size:11.5px; border-radius:9px; }

/* Auto cards */
.ac { border-radius:12px; padding:14px; }
.at-t { font-size:13px; font-weight:700; }
.at-d { font-size:11px; }

/* Exp cards */
.exp-card { border-radius:10px; }
.exp-client { font-size:13px; font-weight:700; }
.exp-meta { font-size:11px; }

<script>
const SB_URL = 'https://datgwhcrcptsxpysfstu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhdGd3aGNyY3B0c3hweXNmc3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMTIyMzAsImV4cCI6MjA5NTc4ODIzMH0.ZGTvsVrzaNCgylbSnzZ0R6t8oVcnttomr6XH4rGXaTs';

/* ─── AUTH ─── */
async function doLogin() {
  const em = document.getElementById('l-em').value.trim();
  const pw = document.getElementById('l-pw').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('lerr');
  if (!em || !pw) { err.textContent = 'Remplissez tous les champs.'; return; }
  btn.disabled = true; btn.textContent = 'Connexion...'; err.textContent = '';
  const { data, error } = await SB.auth.signInWithPassword({ email: em, password: pw });
  if (error) {
    err.textContent = 'Email ou mot de passe incorrect.';
    btn.disabled = false; btn.textContent = 'Se connecter'; return;
  }
  const { data: p } = await SB.from('profiles').select('pro_role,full_name,store_name').eq('id', data.user.id).single();
  if (!p || !['seller','company'].includes(p.pro_role)) {
    err.textContent = 'Accès réservé aux vendeurs Lincoo+.';
    await SB.auth.signOut(); btn.disabled = false; btn.textContent = 'Se connecter'; return;
  }
  CU = { ...data.user, name: p.full_name || em.split('@')[0], store: p.store_name };
  const { data: st } = await SB.from('stores').select('id').eq('owner_id', data.user.id).maybeSingle();
  if (st) SID = st.id;
  showApp();
}

async function doLogout() {
  await SB.auth.signOut(); CU = null; SID = null;
  document.getElementById('app').classList.remove('on');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('l-em').value = '';
  document.getElementById('l-pw').value = '';
  document.getElementById('l-btn').disabled = false;
  document.getElementById('l-btn').textContent = 'Se connecter';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('on');
  document.getElementById('u-av').textContent = (CU.name||'V').substring(0,2).toUpperCase();
  document.getElementById('u-nm').textContent = CU.name;
  if (window.lucide) lucide.createIcons();
  go('dash');
}

window.addEventListener('load', async () => {
  const { data } = await SB.auth.getSession();
  if (!data.session) { document.getElementById('login-screen').style.display = 'flex'; return; }
  const { data: p } = await SB.from('profiles').select('pro_role,full_name,store_name').eq('id', data.session.user.id).single();
  if (p && ['seller','company'].includes(p.pro_role)) {
    CU = { ...data.session.user, name: p.full_name || data.session.user.email.split('@')[0], store: p.store_name };
    const { data: st } = await SB.from('stores').select('id').eq('owner_id', data.session.user.id).maybeSingle();
    if (st) SID = st.id;
    showApp();
  } else { document.getElementById('login-screen').style.display = 'flex'; }
});

/* ─── ROUTER ─── */
function go(p) {
  if (CHART) { try { CHART.destroy(); } catch(e){} CHART = null; }
  document.querySelectorAll('.ni').forEach(el => el.classList.toggle('on', el.dataset.p === p));
  ({ dash:pgDash, prod:pgProd, ordr:pgOrdr, cred:pgCred, stat:pgStat, auto:pgAuto, coac:pgCoac, livr:pgLivr, equi:pgEquipe, abon:pgAbon, sett:pgSett })[p]();
}

/* ─── DASHBOARD ─── */
async function pgDash() {
  const M = document.getElementById('main');
  M.innerHTML = `<div class="ph"><div class="pt">Tableau de bord</div><div class="ps">Bonjour ${CU?.name||'Vendeur'}</div></div>
    <div class="kg">${Array(6).fill('<div class="kc"><div class="kv" style="color:var(--dim);font-size:18px">—</div></div>').join('')}</div>`;
  let prods = [], storeData = {};
  if (SID) {
    const [pr, sr] = await Promise.all([
      SB.from('products').select('available,sold_count,price').eq('store_id', SID),
      SB.from('stores').select('total_sales,rating,followers_count').eq('id', SID).single()
    ]);
    prods = pr.data || []; storeData = sr.data || {};
  }
  const act = prods.filter(p => p.available).length;
  const rev = prods.reduce((s, p) => s + ((p.sold_count||0) * (p.price||0)), 0);
  const sold = prods.reduce((s, p) => s + (p.sold_count||0), 0);
  const kpis = [
    { l:'CA du mois',      v: F(rev)+' DA',                c:'var(--teal)', d:'+12% vs mois passé',   i:'' },
    { l:'Commandes',       v: sold,                         c:'var(--blue)', d:'commandes totales',    i:'' },
    { l:'Produits actifs', v: act+'/'+prods.length,         c:'var(--purp)', d:'actifs / total',       i:'' },
    { l:'Score crédibilité',v:'72/100',                     c:'var(--gold)', d:'Niveau Argent',        i:'' },
    { l:'Taux conversion', v: '3.4%',                       c:'var(--green)',d:'+0.2% cette semaine',  i:'' },
    { l:'Revenus nets',    v: F(Math.round(rev*.92))+' DA', c:'var(--teal)', d:'après commission 8%',  i:'' },
  ];
  M.innerHTML = `
    <div class="ph"><div class="pt">Tableau de bord</div><div class="ps">Bonjour ${CU?.name||'Vendeur'} · ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
    <div class="kg">${kpis.map(k=>`<div class="kc"><span class="ki">${k.i}</span><div class="kl">${k.l}</div><div class="kv" style="color:${k.c}">${k.v}</div><div class="kd">${k.d}</div></div>`).join('')}</div>
    <div class="cc">
      <div class="ch"><div class="ct">Ventes sur 30 jours</div><div style="font-size:10px;color:var(--dim)">Chiffre d'affaires en DA</div></div>
      <canvas id="CH" height="70"></canvas>
    </div>
    <div class="tc">
      <div class="th"><div class="tt">Dernières commandes</div><div class="ta" onclick="go('ordr')">Voir tout</div></div>
      <table><thead><tr><th>#</th><th>Client</th><th>Montant</th><th>Wilaya</th><th>Statut</th><th>Smart</th></tr></thead>
      <tbody id="dash-ordr-tbody"><tr><td colspan="6" style="text-align:center;padding:20px;color:var(--dim)">Chargement…</td></tr></tbody></table>
    </div>`;
  loadOrders();
  setTimeout(() => {
    const ctx = document.getElementById('CH')?.getContext('2d'); if (!ctx) return;
    const lbs = Array.from({length:30},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(29-i));return d.getDate()+'/'+(d.getMonth()+1);});
    CHART = new Chart(ctx, {
      type:'line',
      data:{ labels:lbs, datasets:[{ data:lbs.map(()=>Math.round(8e3+Math.random()*5e4)), borderColor:'#3B82F6', backgroundColor:'rgba(59,130,246,.08)', borderWidth:2, fill:true, tension:.4, pointRadius:0 }] },
      options:{ plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'#0D0B2D', borderColor:'rgba(255,255,255,.08)', borderWidth:1, titleColor:'#9CA3AF', bodyColor:'#fff', bodyFont:{size:12,weight:'bold'}, callbacks:{label:v=>Number(v.raw).toLocaleString('fr-FR')+' DA'} } },
        scales:{ x:{ grid:{color:'rgba(13,11,45,.06)'}, ticks:{color:'#667085',font:{size:9},maxTicksLimit:6} }, y:{ grid:{color:'rgba(13,11,45,.06)'}, ticks:{color:'#667085',font:{size:9},callback:v=>(v/1000).toFixed(0)+'k'} } } }
    });
  }, 60);
}

/* ─── PRODUCTS ─── */
async function pgProd() {
  const M = document.getElementById('main');
  M.innerHTML = `<div class="ph"><div class="pt">Produits</div><div class="ps">Chargement...</div></div>`;
  let prods = [];
  if (SID) {
    const { data } = await SB.from('products').select('id,name,price,promo_price,images,stock_qty,available,sold_count').eq('store_id', SID).order('created_at',{ascending:false}).limit(40);
    prods = data || [];
  }
  M.innerHTML = `
    <div class="ph"><div class="pt">Produits <span style="font-size:13px;font-weight:600;color:var(--dim)">(${prods.length})</span></div><div class="ps">Gérez votre catalogue</div></div>
    <div class="bar"><input class="srch" placeholder="🔍  Rechercher..." oninput="FP(this.value)" /><button class="bp">+ Ajouter</button></div>
    <div class="pg" id="PG">
      ${prods.length ? prods.map(p => {
        const img = Array.isArray(p.images) && p.images.length ? p.images[0] : null;
        return `<div class="pcard" data-nm="${(p.name||'').toLowerCase()}">
          ${img ? `<img class="pimg" src="${img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="pfb" style="display:none">📦</div>` : `<div class="pfb">📦</div>`}
          <div class="pi"><div class="pn">${p.name||'—'}</div><div class="pp">${F(p.promo_price||p.price)} DA</div><div class="ps2">Stock: ${p.stock_qty??'—'} · Vendus: ${p.sold_count??0}</div></div>
          <div class="pbs"><button class="pb">✏️ Modifier</button><button class="pb del" onclick="DP('${p.id}',this)">🗑️ Suppr.</button></div>
        </div>`;
      }).join('') : `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--dim)">Aucun produit dans votre boutique.</div>`}
    </div>`;
}
function FP(q) { document.querySelectorAll('#PG .pcard').forEach(el => el.style.display = el.dataset.nm.includes(q.toLowerCase()) ? '' : 'none'); }
async function DP(id, btn) {
  if (!confirm('Supprimer ce produit ?')) return;
  btn.closest('.pcard').style.opacity = '.4';
  const { error } = await SB.from('products').delete().eq('id', id);
  if (!error) btn.closest('.pcard').remove();
  else { btn.closest('.pcard').style.opacity = '1'; toast('Erreur suppression.'); }
}

/* ─── ORDERS ─── */
function pgOrdr() {

    <div class="ph"><div class="pt">Commandes</div><div class="ps">Suivi & gestion des commandes</div></div>
    <div class="bar"><input class="srch" placeholder="Rechercher client, commande…" /><span class="b bbl" style="padding:7px 12px;font-size:10px;font-weight:600">Smart Delivery actif</span></div>

function orderShortId(id) { return String(id).slice(0,8).toUpperCase(); }

function orderRow(o) {
  return `<tr id="orow-${o.id}">
    <td style="font-weight:800;color:var(--blue)">#${orderShortId(o.id)}</td>
    <td><div style="font-weight:700">${o.cl}</div><div style="font-size:10px;color:var(--dim)">${o.ph}</div></td>
    <td style="font-size:11px;color:var(--dim);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.pr}</td>
    <td style="font-weight:800;color:var(--teal);white-space:nowrap">${F(o.amt)} DA</td>
    <td>${o.wil}</td>
    <td style="font-size:11px">${o.dt==='Dom'?'🏠 Domicile':'📫 Stop Desk'}</td>
    <td>${BS(o.st)}</td>
    <td>${BM(o.mode)}</td>
    <td><select onchange="UO('${o.id}',this.value)" style="background:var(--card);border:1px solid var(--brd);border-radius:8px;color:var(--txt);padding:4px 7px;font-size:10px;font-family:inherit;outline:none;cursor:pointer">
      ${['En attente','Confirmée','Expédiée','Livrée','Retournée'].map(s=>`<option ${s===o.st?'selected':''}>${s}</option>`).join('')}
    </select></td>
    <td><button onclick="openOrderEdit('${o.id}')" title="Modifier les détails" style="background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);border-radius:8px;color:var(--blue);padding:5px 9px;font-size:13px;cursor:pointer;line-height:1">✏️</button></td>
  </tr>`;
}

async function UO(id, st) {
  if (st === 'Expédiée') { openExpedModal(id); return; }
  const o = ORDERS.find(o=>o.id===id);
  if (!o) return;
  const dbStatus = ST_FR_TO_DB[st] || 'pending';
  try {
    const { error } = await SB.from('orders').update({ status: dbStatus }).eq('id', id);
    if (error) throw error;
    o.st = st;
    const row = document.getElementById('orow-'+id);
    if (row) row.outerHTML = orderRow(o);
    toast('Statut mis à jour ✓');
  } catch (e) {
    toast('⚠️ Erreur lors de la mise à jour du statut');
  }
}

        <div class="mfield">
          <label>Téléphone</label>

        </div>
      </div>
      <div class="mrow">
        <div class="mfield">

          <input type="text" id="oe-wil" value="${o.wil}" />
        </div>
        <div class="mfield">
          <label>Point de remise</label>
          <select id="oe-dt" class="role-sel" style="width:100%;padding:9px 12px;border-radius:10px;font-size:12px">
            <option value="Dom" ${o.dt==='Dom'?'selected':''}>🏠 Domicile</option>
            <option value="Stop" ${o.dt!=='Dom'?'selected':''}>📫 Stop Desk</option>
          </select>
        </div>
      </div>
      <div class="mrow">
        <div class="mfield">
          <label>Mode de livraison</label>
          <select id="oe-mode" class="role-sel" style="width:100%;padding:9px 12px;border-radius:10px;font-size:12px">
            <option value="standard" ${(o.mode||'standard')==='standard'?'selected':''}>📦 Standard</option>
            <option value="express"  ${o.mode==='express' ?'selected':''}>🚀 Express</option>
            <option value="smart"    ${o.mode==='smart'   ?'selected':''}>⚡ Smart (auto-sélection société)</option>
          </select>
        </div>
        <div class="mfield">
          <label>Adresse complète</label>
          <input type="text" id="oe-addr" placeholder="N° rue, cité, commune…" value="${o.addr||''}" />
        </div>
      </div>
      <div class="mrow">
        <div class="mfield">
          <label>Produit(s)</label>
          <input type="text" id="oe-pr" value="${o.pr}" />
        </div>
        <div class="mfield">
          <label>Montant (DA)</label>
          <input type="number" id="oe-amt" value="${o.amt}" />
        </div>
      </div>
      <div class="mfield">

async function saveOrderEdit(ordId) {
  const o = ORDERS.find(x=>x.id===ordId);
  if (!o) return;
  const newSt = document.getElementById('oe-st').value;
  const wasConfirmed = o.st === 'Confirmée';
  const cl   = document.getElementById('oe-cl').value.trim()   || o.cl;
  const ph   = document.getElementById('oe-ph').value.trim()   || o.ph;
  const wil  = document.getElementById('oe-wil').value.trim()  || o.wil;
  const addr = document.getElementById('oe-addr').value.trim();
  const dt   = document.getElementById('oe-dt').value;
  const mode = document.getElementById('oe-mode').value || 'standard';
  const note = document.getElementById('oe-note').value.trim();
  const pr   = document.getElementById('oe-pr').value.trim()   || o.pr;
  const amt  = +document.getElementById('oe-amt').value        || o.amt;

  try {
    const { error } = await SB.from('orders').update({
      status:        ST_FR_TO_DB[newSt] || 'pending',
      buyer_name:    cl,
      buyer_phone:   ph,
      wilaya:        wil,
      address:       addr,
      delivery_type: dt === 'Dom' ? 'home' : 'stopdesk',
      delivery_mode: mode,
      notes:         note,
    }).eq('id', ordId);
    if (error) throw error;
  } catch (e) {
    toast('⚠️ Erreur lors de la sauvegarde');
    return;
  }

  o.cl = cl; o.ph = ph; o.wil = wil; o.addr = addr;
  o.dt = dt; o.mode = mode; o.note = note; o.pr = pr; o.amt = amt;
  o.st = newSt;
  document.getElementById('order-edit-modal')?.remove();
  const row = document.getElementById('orow-'+ordId);
  if (row) row.outerHTML = orderRow(o);
  if (newSt === 'Expédiée' && wasConfirmed) { openExpedModal(ordId); return; }
  toast('✅ Commande #'+orderShortId(ordId)+' mise à jour');
}

function getTariff(coId, wilCode, type) {
  if (DELIV_TARIFFS[coId]?.[wilCode]?.[type] != null) return DELIV_TARIFFS[coId][wilCode][type];
  const co = DELIV_COS.find(c=>c.id===coId);
  const zone = parseInt(wilCode)<=10?1:parseInt(wilCode)<=25?1.1:parseInt(wilCode)<=40?1.2:1.4;
  return Math.round((type==='home'?co.home_base:co.desk_base)*zone);
}
function setTariff(coId, wilCode, type, val) {
  if (!DELIV_TARIFFS[coId]) DELIV_TARIFFS[coId]={};
  if (!DELIV_TARIFFS[coId][wilCode]) DELIV_TARIFFS[coId][wilCode]={};
  DELIV_TARIFFS[coId][wilCode][type] = +val;
  saveTariffs();
}

  if (DELIV_TARIFFS[coId]) delete DELIV_TARIFFS[coId][wilCode];

async function confirmExped(ordId) {
  const coId = document.getElementById('exped-co')?.value;
  const co = DELIV_COS.find(c=>c.id===coId) || DELIV_COS.find(c=>c.active);
  const o = ORDERS.find(x=>x.id===ordId);
  if (!o) return;
  try {
    const { error } = await SB.from('orders').update({ status: 'shipped' }).eq('id', ordId);
    if (error) throw error;
  } catch (e) {
    toast('⚠️ Erreur lors de la mise à jour du statut');
    return;
  }
  o.st = 'Expédiée';
  document.getElementById('exped-modal')?.remove();
  const row = document.getElementById('orow-'+ordId);
  if (row) row.outerHTML = orderRow(o);
  toast(`✅ Commande #${orderShortId(ordId)} envoyée vers ${co?.nm||'société de livraison'}`);
  renderLivrExpeds();
}

    return `<tr>
      <td style="font-weight:700">${m.nm || '—'}</td>
      <td style="color:var(--dim);font-size:11px">${m.em || (isSelf?CU?.email||'—':'—')}</td>

          ? `<span class="b" style="background:${r.c}22;color:${r.c}">${r.l}</span>`
          : `<select class="role-sel" onchange="updateTeamRole(${i},this.value)">

             </select>`}

      <td>${m.valid
        ? `<span class="b bgn">✅ Validé</span>`
        : `<span class="b bgo">⏳ En attente</span>`}

function updateTeamRole(i, role) { TEAM[i].role = role; saveTeam(); toast(`Rôle mis à jour : ${ROLE_LABELS[role]?.l}`); }

function deleteMember(i) {
  if (!confirm(`Supprimer ${TEAM[i].nm||TEAM[i].em} de l'équipe ?`)) return;

}

          <input style="width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--brd);border-radius:10px;color:var(--txt);font-size:12px;font-family:inherit;outline:none" placeholder="${f}..." />
        </div>`).join('')}
        <button class="bp" style="width:100%;padding:11px" onclick="toast('Informations enregistrées ✓')">Enregistrer</button>
      </div>
      <div class="cc">
        <div class="ch"><div class="ct">Notifications</div></div>
        ${['Nouvelle commande','Rupture de stock','Nouvel avis client','Message client','Rapport hebdomadaire','Conseils Coach IA','Alertes paiement','Promotions Lincoo'].map(f=>`<div class="row">
          <div style="font-size:12px;font-weight:600">${f}</div>
          <label class="tog"><input type="checkbox" checked><span class="tsl"></span></label>
        </div>`).join('')}
      </div>
    </div>`;
}

/* ─── ORDERS (live from Supabase) ─── */
let ORDERS = [];
let ordersChannel = null;

const ST_DB_TO_FR = {
  pending:   'En attente',
  confirmed: 'Confirmée',
  shipped:   'Expédiée',
  delivered: 'Livrée',
  cancelled: 'Annulée',
  refunded:  'Retournée',
};
const ST_FR_TO_DB = {
  'En attente': 'pending',
  'Confirmée':  'confirmed',
  'Expédiée':   'shipped',
  'Livrée':     'delivered',
  'Annulée':    'cancelled',
  'Retournée':  'refunded',
};

function mapOrderRow(o) {
  const items = Array.isArray(o.items) ? o.items : [];
  return {
    id:   o.id,
    cl:   o.buyer_name  || '—',
    ph:   o.buyer_phone || '—',
    pr:   items.length ? items.map(i => `${i.name || 'Produit'} × ${i.qty || 1}`).join(', ') : '—',
    amt:  o.total || 0,
    wil:  o.wilaya || '—',
    dt:   o.delivery_type === 'stopdesk' ? 'Stop' : 'Dom',
    st:   ST_DB_TO_FR[o.status] || 'En attente',
    mode: o.delivery_mode || 'standard',
    addr: o.address || '',
    note: o.notes || '',
  };
}

async function loadOrders() {
  if (!CU) return;
  try {
    const { data, error } = await SB.from('orders')
      .select('*')
      .eq('seller_id', CU.id)
      .order('created_at', { ascending: false })
      .limit(100);
    if (error) throw error;
    ORDERS = (data || []).map(mapOrderRow);
  } catch (e) {
    ORDERS = [];
  }
  renderOrdersTable();
  subscribeOrders();
}

function renderOrdersTable() {
  const tbody = document.getElementById('ordr-tbody');
  if (tbody) {
    tbody.innerHTML = ORDERS.length
      ? ORDERS.map(o => orderRow(o)).join('')
      : `<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--dim)">Aucune commande pour le moment.</td></tr>`;
  }
  const countEl = document.getElementById('ordr-count');
  if (countEl) countEl.textContent = `Toutes les commandes (${ORDERS.length})`;
  const pendEl = document.getElementById('ordr-pending');
  if (pendEl) pendEl.textContent = `${ORDERS.filter(o => o.st === 'En attente').length} en attente`;

  const dashTbody = document.getElementById('dash-ordr-tbody');
  if (dashTbody) {
    dashTbody.innerHTML = ORDERS.length
      ? ORDERS.slice(0, 5).map(o => `<tr>
          <td style="color:var(--dim);font-size:10px">#${orderShortId(o.id)}</td>
          <td style="font-weight:700">${o.cl}</td>
          <td style="color:var(--teal);font-weight:800">${F(o.amt)} DA</td>
          <td>${o.wil}</td><td>${BS(o.st)}</td>
          <td>${BM(o.mode)}</td>
        </tr>`).join('')
      : `<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--dim)">Aucune commande pour le moment.</td></tr>`;
  }
}

function subscribeOrders() {
  if (!CU) return;
  if (ordersChannel) { SB.removeChannel(ordersChannel); ordersChannel = null; }
  ordersChannel = SB.channel('seller-orders-' + CU.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'orders', filter: `seller_id=eq.${CU.id}` },
      () => loadOrders())
    .subscribe();
}

/* ─── HELPERS ─── */
function F(n) { if (!n && n!==0) return '0'; return Math.round(n).toLocaleString('fr-FR'); }
function BS(s) {
  const m = {'En attente':'bgo','Confirmée':'bbl','Expédiée':'bpu','Livrée':'bgn','Retournée':'brd'};
  return `<span class="b ${m[s]||'bdm'}">${s}</span>`;
}
function BM(mode) {
  if (mode==='smart')    return `<span class="b bbl">⚡ Smart</span>`;
  if (mode==='express')  return `<span class="b bgo">🚀 Express</span>`;
  return `<span class="b bdm">📦 Standard</span>`;
}
function toast(msg, dur=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), dur);
}
</script>
