<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lincoo+ · Tableau de bord vendeur</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:     #07080F;
      --sb:     #0C0E1C;
      --card:   #12142A;
      --bord:   #1A1D38;
      --blue:   #3D8BFF;
      --purp:   #8B5CF6;
      --teal:   #06EFC5;
      --gold:   #FFB800;
      --red:    #FF4B4B;
      --green:  #22C55E;
      --text:   #EAEBF5;
      --muted:  #6B7080;
      --r:      14px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Montserrat',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow:hidden; }

    /* ── LOGIN ── */
    #login {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(ellipse at 20% 60%,rgba(61,139,255,.1) 0%,transparent 55%),
                  radial-gradient(ellipse at 80% 30%,rgba(139,92,246,.08) 0%,transparent 55%), var(--bg);
    }
    .lbox { background:var(--card); border:1px solid var(--bord); border-radius:24px; padding:48px 40px; width:100%; max-width:420px; box-shadow:0 40px 80px rgba(0,0,0,.5); }
    .ltop { text-align:center; margin-bottom:36px; }
    .ltop .mark { font-size:34px; font-weight:900; background:linear-gradient(135deg,var(--blue),var(--purp)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:1px; }
    .ltop .sub  { color:var(--muted); font-size:12px; margin-top:4px; }
    .lbl { display:block; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
    .linp { width:100%; padding:13px 16px; background:var(--bg); border:1.5px solid var(--bord); border-radius:12px; color:var(--text); font-family:'Montserrat',sans-serif; font-size:14px; outline:none; transition:border-color .2s; margin-bottom:16px; }
    .linp:focus { border-color:var(--blue); }
    .lbtn { width:100%; padding:14px; background:linear-gradient(135deg,var(--blue),var(--purp)); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:800; font-family:'Montserrat',sans-serif; cursor:pointer; margin-top:6px; letter-spacing:.5px; transition:opacity .2s; }
    .lbtn:hover { opacity:.9; } .lbtn:disabled { opacity:.5; cursor:default; }
    .lerr { color:var(--red); font-size:12px; text-align:center; margin-top:10px; min-height:16px; }

    /* ── APP ── */
    #app { display:none; height:100vh; overflow:hidden; }
    #app.on { display:flex; }

    /* ── SIDEBAR ── */
    #sb { width:220px; min-width:220px; background:var(--sb); border-right:1px solid var(--bord); display:flex; flex-direction:column; height:100vh; overflow-y:auto; }
    .sb-logo { padding:22px 20px; border-bottom:1px solid var(--bord); }
    .sb-logo .mark { font-size:20px; font-weight:900; background:linear-gradient(135deg,var(--blue),var(--purp)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:1px; }
    .sb-logo .sub  { font-size:10px; color:var(--muted); margin-top:2px; }
    .sb-nav { flex:1; padding:10px 0; }
    .sec-lbl { font-size:9px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; padding:14px 20px 5px; }
    .ni { display:flex; align-items:center; gap:10px; padding:10px 20px; cursor:pointer; color:var(--muted); font-size:12px; font-weight:700; position:relative; user-select:none; transition:all .15s; }
    .ni:hover { color:var(--text); background:rgba(255,255,255,.04); }
    .ni.act { color:var(--blue); background:rgba(61,139,255,.1); }
    .ni.act::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--blue); border-radius:0 4px 4px 0; }
    .ni-ico { font-size:15px; width:20px; text-align:center; }
    .sb-user { padding:14px 18px; border-top:1px solid var(--bord); }
    .u-row { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
    .u-av { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--purp)); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; color:#fff; flex-shrink:0; }
    .u-name { font-size:12px; font-weight:700; }
    .u-role { font-size:10px; color:var(--muted); }
    .o-btn { width:100%; padding:7px; background:rgba(255,75,75,.1); border:1px solid rgba(255,75,75,.2); border-radius:8px; color:var(--red); font-size:10px; font-weight:700; font-family:'Montserrat',sans-serif; cursor:pointer; transition:background .2s; }
    .o-btn:hover { background:rgba(255,75,75,.2); }

    /* ── MAIN ── */
    #main { flex:1; overflow-y:auto; padding:28px; }
    .ph { margin-bottom:22px; }
    .ptitle { font-size:22px; font-weight:900; letter-spacing:-.5px; }
    .psub { font-size:12px; color:var(--muted); margin-top:4px; }

    /* ── CARDS ── */
    .kgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:12px; margin-bottom:22px; }
    .kcard { background:var(--card); border:1px solid var(--bord); border-radius:var(--r); padding:18px; position:relative; overflow:hidden; }
    .klbl { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:7px; }
    .kval { font-size:26px; font-weight:900; letter-spacing:-1px; line-height:1; }
    .kdelta { font-size:10px; font-weight:600; margin-top:5px; color:var(--muted); }
    .k-ico { position:absolute; top:14px; right:14px; font-size:20px; opacity:.55; }
    .ccard { background:var(--card); border:1px solid var(--bord); border-radius:var(--r); padding:20px; margin-bottom:20px; }
    .ch { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .ct { font-size:14px; font-weight:800; }
    .tcard { background:var(--card); border:1px solid var(--bord); border-radius:var(--r); overflow:hidden; margin-bottom:20px; }
    .thead2 { padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--bord); }
    .thtitle { font-size:13px; font-weight:800; }
    table { width:100%; border-collapse:collapse; }
    thead th { padding:10px 18px; text-align:left; font-size:9px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid var(--bord); }
    tbody tr { border-bottom:1px solid rgba(255,255,255,.04); transition:background .15s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:rgba(255,255,255,.025); }
    tbody td { padding:12px 18px; font-size:12px; }

    /* ── BADGES ── */
    .badge { display:inline-block; padding:3px 9px; border-radius:100px; font-size:10px; font-weight:700; }
    .b-blue  { background:rgba(61,139,255,.15); color:var(--blue); }
    .b-green { background:rgba(34,197,94,.15); color:var(--green); }
    .b-gold  { background:rgba(255,184,0,.15); color:var(--gold); }
    .b-red   { background:rgba(255,75,75,.15); color:var(--red); }
    .b-purp  { background:rgba(139,92,246,.15); color:var(--purp); }
    .b-teal  { background:rgba(6,239,197,.15); color:var(--teal); }
    .b-muted { background:rgba(107,112,128,.15); color:var(--muted); }

    /* ── TOGGLE ── */
    .tog { position:relative; width:42px; height:22px; flex-shrink:0; }
    .tog input { display:none; }
    .tsl { position:absolute; inset:0; background:var(--bord); border-radius:100px; cursor:pointer; transition:background .2s; }
    .tsl::before { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:3px; left:3px; transition:transform .2s; }
    .tog input:checked + .tsl { background:var(--blue); }
    .tog input:checked + .tsl::before { transform:translateX(20px); }

    /* ── CREDIBILITY ── */
    .ring { width:160px; height:160px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
    .ring-inner { width:118px; height:118px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .crit { background:var(--card); border:1px solid var(--bord); border-radius:12px; padding:14px; }
    .crit-top { display:flex; justify-content:space-between; margin-bottom:7px; }
    .crit-nm { font-size:12px; font-weight:700; }
    .crit-pt { font-size:12px; font-weight:800; color:var(--teal); }
    .bar-bg { height:4px; background:var(--bord); border-radius:2px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--blue),var(--teal)); }

    /* ── AUTOMATIONS ── */
    .acard { background:var(--card); border:1px solid var(--bord); border-radius:14px; padding:16px 18px; display:flex; align-items:center; gap:14px; margin-bottom:10px; }
    .aico { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }

    /* ── COACH ── */
    .coach { background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(236,72,153,.12)); border:1px solid rgba(139,92,246,.3); border-radius:16px; padding:24px; margin-bottom:18px; }
    .coh { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .co-av { width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--purp),#EC4899); display:flex; align-items:center; justify-content:center; font-size:22px; }

    /* ── PRODUCTS ── */
    .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
    .pcard { background:var(--card); border:1px solid var(--bord); border-radius:14px; overflow:hidden; }
    .pimg { width:100%; height:155px; object-fit:cover; }
    .pimg-fb { width:100%; height:155px; background:var(--bord); display:flex; align-items:center; justify-content:center; font-size:40px; }
    .pinfo { padding:11px 13px; }
    .pname { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
    .pprice { font-size:14px; font-weight:900; color:var(--blue); }
    .pstock { font-size:10px; color:var(--muted); margin-top:2px; }
    .pact { display:flex; gap:5px; padding:9px 13px; border-top:1px solid var(--bord); }
    .sbtn { flex:1; padding:5px; border-radius:7px; border:1px solid var(--bord); background:transparent; color:var(--muted); font-size:10px; font-weight:700; font-family:'Montserrat',sans-serif; cursor:pointer; transition:all .15s; }
    .sbtn:hover { background:var(--bord); color:var(--text); }
    .sbtn.d:hover { background:rgba(255,75,75,.15); border-color:var(--red); color:var(--red); }

    /* ── TOOLBAR ── */
    .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .srch { flex:1; max-width:300px; padding:9px 14px; background:var(--card); border:1px solid var(--bord); border-radius:10px; color:var(--text); font-size:12px; font-family:'Montserrat',sans-serif; outline:none; }
    .srch:focus { border-color:var(--blue); }
    .btn-p { padding:9px 18px; background:linear-gradient(135deg,var(--blue),var(--purp)); color:#fff; border:none; border-radius:10px; font-size:12px; font-weight:800; font-family:'Montserrat',sans-serif; cursor:pointer; transition:opacity .2s; }
    .btn-p:hover { opacity:.9; }

    /* ── PACKS ── */
    .pgk { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    .pk { background:var(--card); border:1px solid var(--bord); border-radius:16px; padding:22px 18px; text-align:center; position:relative; overflow:hidden; }
    .pk.pop { border-color:var(--blue); }
    .pk-pop-badge { position:absolute; top:10px; right:10px; background:var(--blue); color:#fff; font-size:9px; font-weight:800; padding:3px 8px; border-radius:6px; }
    .pk-cur { position:absolute; top:10px; left:10px; background:rgba(34,197,94,.2); color:var(--green); font-size:9px; font-weight:800; padding:3px 8px; border-radius:6px; }
    .pk-name { font-size:15px; font-weight:900; margin-bottom:4px; }
    .pk-price { font-size:26px; font-weight:900; margin:10px 0 3px; }
    .pk-per { font-size:10px; color:var(--muted); margin-bottom:14px; }
    .pk-feats { list-style:none; text-align:left; margin-bottom:18px; }
    .pk-feats li { font-size:11px; color:rgba(234,235,245,.75); padding:4px 0; display:flex; align-items:center; gap:6px; }
    .pk-feats li::before { content:'✓'; color:var(--teal); font-weight:900; font-size:9px; }
    .pk-btn { width:100%; padding:10px; border-radius:10px; border:none; font-size:12px; font-weight:800; font-family:'Montserrat',sans-serif; cursor:pointer; transition:opacity .2s; }
    .pk-btn:hover { opacity:.9; }

    /* ── WILAYA BARS ── */
    .wb { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
    .wb-nm { width:110px; font-size:11px; font-weight:700; flex-shrink:0; }
    .wb-bg { flex:1; height:8px; background:var(--bord); border-radius:4px; overflow:hidden; }
    .wb-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--blue),var(--purp)); }
    .wb-pct { width:36px; text-align:right; font-size:11px; font-weight:700; color:var(--blue); }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--bord); border-radius:4px; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════ LOGIN ══════════════════════════════════════ -->
<div id="login">
  <div class="lbox">
    <div class="ltop">
      <div class="mark">Lincoo+</div>
      <div class="sub">Espace vendeur professionnel · Connexion</div>
    </div>
    <label class="lbl">Email</label>
    <input class="linp" id="l-em" type="email" placeholder="votre@email.com" onkeydown="if(event.key==='Enter')doLogin()" />
    <label class="lbl">Mot de passe</label>
    <input class="linp" id="l-pw" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="lbtn" id="l-btn" onclick="doLogin()">Se connecter</button>
    <div class="lerr" id="l-err"></div>
  </div>
</div>

<!-- ══════════════════════════════════════ APP ══════════════════════════════════════ -->
<div id="app">
  <aside id="sb">
    <div class="sb-logo">
      <div class="mark">Lincoo+</div>
      <div class="sub">Tableau de bord vendeur</div>
    </div>
    <nav class="sb-nav">
      <div class="sec-lbl">Principal</div>
      <div class="ni act" onclick="go('dash')"><span class="ni-ico">⚡</span>Tableau de bord</div>
      <div class="ni" onclick="go('prod')"><span class="ni-ico">📦</span>Produits</div>
      <div class="ni" onclick="go('ordr')"><span class="ni-ico">📋</span>Commandes</div>
      <div class="sec-lbl">Performance</div>
      <div class="ni" onclick="go('cred')"><span class="ni-ico">🏅</span>Ma Crédibilité</div>
      <div class="ni" onclick="go('stat')"><span class="ni-ico">📊</span>Statistiques</div>
      <div class="sec-lbl">Outils IA</div>
      <div class="ni" onclick="go('auto')"><span class="ni-ico">⚙️</span>Automatisations</div>
      <div class="ni" onclick="go('coac')"><span class="ni-ico">🤖</span>Coach IA</div>
      <div class="sec-lbl">Gestion</div>
      <div class="ni" onclick="go('livr')"><span class="ni-ico">🚚</span>Livraisons</div>
      <div class="ni" onclick="go('abon')"><span class="ni-ico">💎</span>Abonnement</div>
      <div class="ni" onclick="go('sett')"><span class="ni-ico">🔧</span>Paramètres</div>
    </nav>
    <div class="sb-user">
      <div class="u-row">
        <div class="u-av" id="u-av">V</div>
        <div><div class="u-name" id="u-nm">Vendeur</div><div class="u-role">Lincoo+ · Pro</div></div>
      </div>
      <button class="o-btn" onclick="doLogout()">↩ Déconnexion</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const { createClient } = supabase;
const sb2 = createClient(
  'https://datgwhcrcptsxpysfstu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhdGd3aGNyY3B0c3hweXNmc3R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMTIyMzAsImV4cCI6MjA5NTc4ODIzMH0.ZGTvsVrzaNCgylbSnzZ0R6t8oVcnttomr6XH4rGXaTs'
);

let CU = null, SID = null, CH = null;

// ══════════════════════════════════════ AUTH ══════════════════════════════════════
async function doLogin() {
  const em = document.getElementById('l-em').value.trim();
  const pw = document.getElementById('l-pw').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!em || !pw) { err.textContent = 'Remplissez tous les champs.'; return; }
  btn.disabled = true; btn.textContent = 'Connexion...'; err.textContent = '';
  const { data, error } = await sb2.auth.signInWithPassword({ email: em, password: pw });
  if (error) { err.textContent = 'Email ou mot de passe incorrect.'; btn.disabled = false; btn.textContent = 'Se connecter'; return; }
  const { data: prof } = await sb2.from('profiles').select('pro_role,full_name,store_name').eq('id', data.user.id).single();
  if (!prof || !['seller','company'].includes(prof.pro_role)) {
    err.textContent = 'Accès réservé aux vendeurs Lincoo+.';
    await sb2.auth.signOut(); btn.disabled = false; btn.textContent = 'Se connecter'; return;
  }
  CU = { ...data.user, name: prof.full_name || em.split('@')[0], store: prof.store_name };
  await loadStore(); showApp();
}

async function loadStore() {
  if (!CU) return;
  const { data } = await sb2.from('stores').select('id').eq('owner_id', CU.id).maybeSingle();
  if (data) SID = data.id;
}

async function doLogout() {
  await sb2.auth.signOut(); CU = null; SID = null;
  document.getElementById('app').classList.remove('on');
  document.getElementById('login').style.display = 'flex';
  document.getElementById('l-em').value = '';
  document.getElementById('l-pw').value = '';
  document.getElementById('l-btn').disabled = false;
  document.getElementById('l-btn').textContent = 'Se connecter';
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('on');
  const ini = (CU.name||'V').substring(0,2).toUpperCase();
  document.getElementById('u-av').textContent = ini;
  document.getElementById('u-nm').textContent = CU.name;
  go('dash');
}

(async () => {
  const { data: { session } } = await sb2.auth.getSession();
  if (!session) return;
  const { data: prof } = await sb2.from('profiles').select('pro_role,full_name,store_name').eq('id', session.user.id).single();
  if (prof && ['seller','company'].includes(prof.pro_role)) {
    CU = { ...session.user, name: prof.full_name || session.user.email.split('@')[0], store: prof.store_name };
    await loadStore(); showApp();
  }
})();

// ══════════════════════════════════════ ROUTER ══════════════════════════════════════
const PAGES = ['dash','prod','ordr','cred','stat','auto','coac','livr','abon','sett'];
function go(p) {
  if (CH) { try { CH.destroy(); } catch(e){} CH = null; }
  document.querySelectorAll('.ni').forEach((el,i) => {
    el.classList.toggle('act', PAGES[i] === p);
  });
  const pages = { dash:renderDash, prod:renderProd, ordr:renderOrdr, cred:renderCred, stat:renderStat, auto:renderAuto, coac:renderCoac, livr:renderLivr, abon:renderAbon, sett:renderSett };
  if (pages[p]) pages[p]();
}

// ══════════════════════════════════════ DASHBOARD ══════════════════════════════════════
async function renderDash() {
  const m = document.getElementById('main');
  m.innerHTML = `<div class="ph"><div class="ptitle">Tableau de bord</div><div class="psub">Bonjour ${CU?.name||'Vendeur'} 👋 · ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div><div class="kgrid">${['—','—','—','—','—','—'].map(_=>`<div class="kcard"><div class="kval" style="color:var(--muted);font-size:18px">—</div></div>`).join('')}</div>`;

  let prods = [], st = {};
  if (SID) {
    const [pr, sr] = await Promise.all([
      sb2.from('products').select('available,sold_count,price').eq('store_id', SID),
      sb2.from('stores').select('total_sales,rating,followers_count').eq('id', SID).single()
    ]);
    prods = pr.data || []; st = sr.data || {};
  }
  const act  = prods.filter(p => p.available).length;
  const rev  = prods.reduce((s,p)=>s+((p.sold_count||0)*(p.price||0)),0);
  const sold = prods.reduce((s,p)=>s+(p.sold_count||0),0);

  const kpis = [
    {l:'CA du mois',      v:fmt(rev)+' DA',                c:'var(--teal)',  d:'+12% vs mois passé', ico:'💰'},

async function renderProd() {
  const m = document.getElementById('main');

  let prods = [];
  if (SID) {
    const { data } = await sb2.from('products').select('id,name,price,promo_price,images,stock_qty,available,sold_count,category').eq('store_id',SID).order('created_at',{ascending:false}).limit(40);
    prods = data || [];
  }
  m.innerHTML = `
    <div class="ph"><div class="ptitle">Produits <span style="font-size:13px;font-weight:600;color:var(--muted)">(${prods.length})</span></div><div class="psub">Gérez votre catalogue · CRUD complet</div></div>
    <div class="toolbar">
      <input class="srch" placeholder="🔍  Rechercher produit..." oninput="filterP(this.value)" />
      <button class="btn-p">+ Ajouter un produit</button>
    </div>
    <div class="pgrid" id="pg">
      ${prods.length===0?`<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">Aucun produit trouvé dans votre boutique.</div>`:prods.map(p=>{
        const img=Array.isArray(p.images)&&p.images.length?p.images[0]:null;
        const pr=p.promo_price||p.price;
        return `<div class="pcard" data-nm="${(p.name||'').toLowerCase()}">
          ${img?`<img class="pimg" src="${img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="pimg-fb" style="display:none">📦</div>`:`<div class="pimg-fb">📦</div>`}
          <div class="pinfo">
            <div class="pname">${p.name||'—'}</div>
            <div class="pprice">${fmt(pr)} DA</div>
            <div class="pstock">Stock: ${p.stock_qty??'—'} · Vendus: ${p.sold_count??0}</div>
          </div>
          <div class="pact">
            <button class="sbtn">✏️ Modifier</button>
            <button class="sbtn d" onclick="delP('${p.id}',this)">🗑️ Suppr.</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function filterP(q) { document.querySelectorAll('#pg .pcard').forEach(el=>{ el.style.display=el.dataset.nm.includes(q.toLowerCase())?'':'none'; }); }

async function delP(id, btn) {
  if (!confirm('Supprimer ce produit ?')) return;
  btn.closest('.pcard').style.opacity='.4';
  const { error } = await sb2.from('products').delete().eq('id',id);
  if (!error) btn.closest('.pcard').remove();
  else { btn.closest('.pcard').style.opacity='1'; alert('Erreur suppression.'); }
}
